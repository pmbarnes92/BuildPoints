// Build Points - global settings
//
// These are the DEFAULTS. A new save starts with a copy of these values,
// and from then on the save keeps its own copy in its persistent file.
// Changes made with Apply in the Space Center toolbar window go to that
// save only; this file is never written by the mod.
//
// Edit this file by hand to change what NEW saves start with. To pull edits
// into a save that already exists, press "Reset to Global Defaults" in the
// toolbar window.
BuildPointsSettings
{
	// Build Points a brand-new save starts with. Only read when a save is
	// first created, so it isn't shown in the in-game window and isn't
	// stored in the save's settings.
	startingPoints = 100

	// Accrual
	baseAccrualPerDay = 5
	facilityLevelBonusPercent = 50

	// Storage cap
	capacity = 200

	// Cost formula:
	//   constantCost + (vessel funds * fundsCostWeight)
	//   + (part count * costPerPart) + (tonnes * massCostWeight)
	// floored at minimumCraftCost
	constantCost = 0
	fundsCostWeight = 0.01
	costPerPart = 0.5
	massCostWeight = 0.2
	minimumCraftCost = 1

	// Percent of a vessel's Build Points cost refunded on recovery
	recoveryRefundPercent = 50

	// "Warp Until Affordable": true = instant clock jump, false = real TimeWarp
	useInstantTimeSkip = False

	// Show the Build Points readout near the top bar
	showBuildPointsDisplay = True
}
